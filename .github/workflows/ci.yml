name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config dbus-x11 gnome-keyring
      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: mcp/pnpm-lock.yaml

      - name: Rust Check & Format
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings

      - name: Run Core Unit Tests
        run: cargo test --manifest-path core/Cargo.toml

      - name: Run CLI Integration Tests
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            dbus-run-session -- cargo test
          else
            cargo test
          fi

      - name: Build MCP Adapter
        working-directory: mcp
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build Release Binary
        run: cargo build --release
