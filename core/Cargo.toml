[package]
name = "envy-core"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
keyring = "2"
thiserror = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
interprocess = "2"
serde_json = "1"
directories = "5"
ignore = "0.4"
ureq = "3"
url = "2"
tempfile = "3"
argon2 = "0.5"
